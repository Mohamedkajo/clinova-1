limit_req_zone $binary_remote_addr zone=clinova_api:10m rate=20r/s;

server {
  listen 80;
  listen [::]:80;
  server_name clinova.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name clinova.example.com;
  server_tokens off;

  # Replace these paths with the certificates managed by Certbot or the hosting platform.
  ssl_certificate /etc/letsencrypt/live/clinova.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clinova.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:ClinovaTLS:10m;
  ssl_session_tickets off;

  client_max_body_size 10m;
  client_body_timeout 30s;
  keepalive_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    limit_req zone=clinova_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /api/health {
    proxy_pass http://127.0.0.1:3000/api/health;
    proxy_set_header Host $host;
    access_log off;
  }

  location ~ /\. {
    deny all;
  }
}
